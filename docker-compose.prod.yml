services:
  backend:
    image: ${BACKEND_IMAGE:-eeum-backend:latest}
    container_name: eeum-backend
    restart: unless-stopped

    env_file:
      - .env.prod

    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
      REDIS_HOST: redis
      REDIS_PORT: 6379
      TZ: Asia/Seoul

    ports:
      - "127.0.0.1:8080:8080"

    volumes:
      - ./secrets/firebase-service-account.json:/app/secrets/firebase.json:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8080/actuator/health/readiness >/dev/null || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

    depends_on:
      redis:
        condition: service_healthy

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7.4-alpine
    container_name: eeum-redis
    restart: unless-stopped

    env_file:
      - .env.prod

    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"

    volumes:
      - redis-data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  redis-data:
