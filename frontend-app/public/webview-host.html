<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <style>
      html, body { width: 100%; height: 100%; margin: 0; padding: 0; }
    </style>
  </head>
  <body>
    <!--
      웹 데모에서 WebView 대체 iframe이 가리키는 빈 문서다. 내용은 PlatformWebView.web.tsx가
      document.write로 채운다.

      srcdoc을 쓰면 문서 URL이 about:srcdoc이 되고, 그 안에서 도는 카카오 지도 SDK가
      location.protocol을 읽어 후속 스크립트 주소를 만들 때 http로 떨어진다. HTTPS로 서빙되는
      배포본에서는 브라우저가 이를 mixed content로 차단해 지도가 "로딩 중"에서 멈춘다.
      (localhost는 HTTP라 이 문제가 드러나지 않는다.)

      같은 출처의 실제 문서를 띄우고 그 안에 내용을 써 넣으면 문서 URL이 https로 유지돼
      SDK가 https 주소를 만든다.
    -->
  </body>
</html>
