server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker 내장 DNS로 backend 호스트를 요청 시점에 매번 다시 resolve한다.
    # 변수를 안 거치고 proxy_pass에 호스트명을 직접 쓰면 nginx가 "설정을 읽는 시점"에
    # 딱 한 번만 resolve하는데, 그때 backend 컨테이너가 아직 안 떠 있으면
    # (예: 재시작 순서, 배포 중 잠깐의 다운타임) nginx 자체가 기동을 거부해버린다.
    resolver 127.0.0.11 valid=30s;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # REST API + SSE 프록시 — 백엔드는 /api 접두사가 없으므로 벗겨서 전달
    location /api/ {
        set $backend_upstream backend:8080;
        proxy_pass http://$backend_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE(Server-Sent Events)가 버퍼링/타임아웃으로 끊기지 않도록
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # WebSocket(STOMP) 프록시
    location /ws {
        set $backend_upstream backend:8080;
        proxy_pass http://$backend_upstream/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # SPA 라우팅 — 정적 파일이 없으면 index.html로 폴백 (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
