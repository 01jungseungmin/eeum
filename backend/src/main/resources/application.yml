spring:
  config:
    import: optional:file:../.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/eeum}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: ${SERVER_PORT:8080}

springdoc:
  swagger-ui:
    tags-sorter: alpha
    operations-sorter: alpha

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: ${JWT_ACCESS_EXPIRATION:1800}
  refresh-token-expiration: ${JWT_REFRESH_EXPIRATION:1209600}
  reauth-token-expiration: ${JWT_REAUTH_TOKEN_EXPIRATION:300}
  password-reset-token-expiration: ${JWT_PASSWORD_RESET_TOKEN_EXPIRATION:1800}

auth:
  email-verification-code-expiration: ${EMAIL_VERIFICATION_CODE_EXPIRATION:300}
  email-verification-token-expiration: ${EMAIL_VERIFICATION_TOKEN_EXPIRATION:1800}

business:
  nts:
    service-key: ${NTS_BUSINESS_SERVICE_KEY}

kakao:
  rest-api-key: ${KAKAO_REST_API_KEY}

portone:
  api-secret: ${PORTONE_API_SECRET}
  base-url: ${PORTONE_BASE_URL:https://api.portone.io}
  webhook-secret: ${PORTONE_WEBHOOK_SECRET}

fcm:
  project-id: ${FCM_PROJECT_ID}
  service-account-key-path: ${FCM_SERVICE_ACCOUNT_KEY_PATH}
  # 발표/시연 시 실제 FCM 발송이 필요하면 --spring.profiles.active=demo 로 기동
  # demo 프로필: FcmPushAdapter(실제 발송) + FCM 단건 테스트 API(/owner/ai-manager/test/fcm) 모두 활성

ai:
  provider: gemini
  fallback-provider: groq
  # final-fallback은 Generator(GeminiAiTextGenerator 등)에서 고정 template으로 처리

  gemini:
    enabled: true
    api-key: ${GEMINI_API_KEY:}
    base-url: https://generativelanguage.googleapis.com/v1beta
    models:
      flash-lite: gemini-2.5-flash-lite
      flash: gemini-2.5-flash

  groq:
    enabled: true
    api-key: ${GROQ_API_KEY:}
    base-url: https://api.groq.com/openai/v1
    models:
      fast: llama-3.1-8b-instant
      quality: llama-3.3-70b-versatile